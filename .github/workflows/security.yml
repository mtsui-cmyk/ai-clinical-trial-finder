name: Security checks

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  secret-pattern-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan for common secret patterns
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE \
            --exclude-dir=.git \
            --exclude-dir=.trial-finder-cache \
            --exclude-dir=.venv \
            --exclude-dir=venv \
            --exclude=.env.example \
            '(sk-[A-Za-z0-9_-]{20,}|ghp_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|xox[baprs]-[A-Za-z0-9-]{20,}|AIza[A-Za-z0-9_-]{20,}|Bearer[[:space:]]+[A-Za-z0-9._-]{20,}|API_KEY=.*[A-Za-z0-9_-]{16,}|SECRET=.*[A-Za-z0-9_-]{16,}|TOKEN=.*[A-Za-z0-9_-]{16,})' .; then
            echo "Potential secret detected. Remove it from tracked files before pushing."
            exit 1
          fi
